org: ruibinch
app: kfseanalysis
service: kfseanalysis
frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-southeast-1
  environment:
    KFSEANALYSIS_BOT_TOKEN: ${env:KFSEANALYSIS_BOT_TOKEN}
    TELEGRAM_CHAT_ID: ${env:TELEGRAM_CHAT_ID}

functions:
  feedback:
    handler: feedback.handler
    events:
      - httpApi:
          path: /feedback
          method: post
