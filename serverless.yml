org: ruibinch
app: kf-spontaneous-escapes
service: spontaneous-escapes-bot
frameworkVersion: '3'
configValidationMode: error
useDotenv: true

plugins:
  # TODO: use custom tsconfig https://www.serverless.com/plugins/serverless-plugin-typescript
  - serverless-plugin-typescript

provider:
  name: aws
  runtime: nodejs16.x
  stage: dev
  region: ap-southeast-1
  environment:
    TZ: Asia/Singapore
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
    TELEGRAM_BOT_TOKEN: ${env:TELEGRAM_BOT_TOKEN}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:CreateTable
            - dynamodb:DeleteTable
            - dynamodb:Query
            - dynamodb:PutItem
          Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/kf-redemptions'
        - Effect: Allow
          Action:
            - dynamodb:CreateTable
            - dynamodb:DeleteTable
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource: 'arn:aws:dynamodb:${self:provider.region}:*:table/kf-redemption-periods'

functions:
  pollUpdates:
    handler: src/main.pollUpdates
    events:
      # runs daily at 22:00 UTC, or 6am SGT
      - schedule: cron(0 22 * * ? *)
